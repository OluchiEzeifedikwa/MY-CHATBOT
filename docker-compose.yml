services:
  db:
    image: postgres:16-alpine
    container_name: medassist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medassist}
      POSTGRES_DB: ${POSTGRES_DB:-medassist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medassist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: medassist_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medassist}:${POSTGRES_PASSWORD:-medassist}@db:5432/${POSTGRES_DB:-medassist}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
